<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명언 뽑기</title>
    <style>
        /* 기본 리셋 및 폰트 설정 (궁서체) */
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            background-color: #222; /* 밖은 어두운 회색 */
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; 
            font-family: '궁서', 'Gungsuh', 'Batang', serif; /* 궁서체 느낌 */
        }

        /* 스마트폰 기기 모양 틀 */
        #smartphone { 
            width: 360px; height: 640px; 
            background-color: #000; /* 앱 배경은 검은색 */
            color: #fff; /* 글씨는 흰색 */
            border: 12px solid #333; border-radius: 35px; 
            position: relative; overflow: hidden; 
            display: flex; flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }

        /* 상단 상태표시줄 (시간, 날씨) */
        #status-bar {
            display: flex; justify-content: space-between; padding: 10px 15px; 
            font-size: 0.8rem; font-family: sans-serif; background: #000; color: #aaa;
        }

        /* 메인 화면 뷰 (3단계) */
        .view { flex: 1; display: none; flex-direction: column; align-items: center; overflow-y: auto; }
        .view.active { display: flex; }

        /* 1. 시작 화면 */
        #view-start { justify-content: center; }
        .app-title { font-size: 3.5rem; font-weight: normal; margin-bottom: 60px; text-align: center; letter-spacing: 5px; line-height: 1.3;}
        .start-btn {
            background: transparent; border: 2px solid #fff; color: #fff; 
            padding: 15px 40px; font-size: 2rem; font-family: '궁서', 'Gungsuh', serif; 
            cursor: pointer; transition: all 0.3s;
        }
        .start-btn:active { background: #fff; color: #000; }

        /* 2. 로딩 화면 */
        #view-loading { justify-content: center; text-align: center; }
        .loading-text { font-size: 1.5rem; font-weight: normal; margin-bottom: 30px; line-height: 1.5;}
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #fff;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 3. 결과 화면 */
        #view-result { justify-content: flex-start; padding: 20px 15px 70px 15px; }
        .result-title { font-size: 1.8rem; font-weight: normal; margin-bottom: 20px; border-bottom: 1px solid #555; padding-bottom: 10px; width: 100%; text-align: center; }
        #result-container { width: 100%; }
        
        .quote-card {
            border: 2px solid #fff; border-radius: 0; /* 스케치처럼 네모나게 */
            padding: 25px 20px; margin-bottom: 20px; text-align: center; 
            cursor: pointer; transition: transform 0.2s;
            text-decoration: none; display: block; color: #fff;
        }
        .quote-card:active { transform: scale(0.95); background-color: #111; }
        
        /* 원문 스타일 추가 (작고 기울임꼴로 고급스럽게) */
        .quote-original { font-size: 1rem; color: #aaa; font-family: sans-serif; font-style: italic; margin-bottom: 15px; line-height: 1.4; word-break: keep-all; }
        
        .quote-text { font-size: 1.3rem; margin-bottom: 20px; line-height: 1.6; word-break: keep-all; }
        .quote-author { font-size: 1.1rem; color: #ddd; }

        /* 돌아가기 버튼 스타일 추가 */
        .back-btn {
            background: transparent; border: 2px solid #fff; color: #fff; 
            padding: 10px 30px; font-size: 1.5rem; font-family: '궁서', 'Gungsuh', serif; 
            cursor: pointer; transition: all 0.3s; margin-top: 20px;
        }
        .back-btn:active { background: #fff; color: #000; }

        /* 하단 네비게이션 바 */
        #bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; 
            background: #000; border-top: 1px solid #333;
            display: flex; justify-content: space-around; align-items: center; 
            font-size: 1.5rem; font-family: sans-serif; color: #ccc;
        }
        .nav-btn { cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

    <div id="smartphone">
        <!-- 상단 상태표시줄 -->
        <div id="status-bar">
            <span id="time-display">00:00</span>
            <span id="weather-display">날씨 정보 찾는 중...</span>
        </div>

        <!-- 1단계: 시작 화면 -->
        <div id="view-start" class="view active">
            <h1 class="app-title">명언<br>뽑기</h1>
            <button class="start-btn" onclick="startGacha()">뽑기</button>
        </div>

        <!-- 2단계: 로딩 화면 -->
        <div id="view-loading" class="view">
            <div class="spinner"></div>
        </div>

        <!-- 3단계: 결과 화면 -->
        <div id="view-result" class="view">
            <h2 class="result-title">오늘의 명언</h2>
            <div id="result-container"></div>
            <!-- 다시 뽑기 버튼으로 변경 -->
            <button class="back-btn" onclick="startGacha()">다시 뽑기</button>
        </div>

        <!-- 하단 네비게이션 바 -->
        <div id="bottom-nav">
            <div class="nav-btn" onclick="alert('메뉴 기능은 준비 중이야!')">☰</div>
            <div class="nav-btn" onclick="goHome()">⌂</div>
            <div class="nav-btn" onclick="goHome()">◁</div>
        </div>
    </div>

    <script>
        // --- 1. 시간 업데이트 기능 ---
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('time-display').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- 2. 날씨 및 위치 가져오기 기능 ---
        async function fetchWeather() {
            const weatherDisplay = document.getElementById('weather-display');
            
            if (!navigator.geolocation) {
                weatherDisplay.innerText = "날씨 정보 없음";
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                try {
                    // 1) 위치(동 이름) 가져오기
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const geoData = await geoRes.json();
                    let locationName = geoData.address.borough || geoData.address.city || geoData.address.town || "내 위치";

                    // 2) 날씨 가져오기 (Open-Meteo API)
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const weatherData = await weatherRes.json();
                    const temp = Math.round(weatherData.current_weather.temperature);
                    const code = weatherData.current_weather.weathercode;
                    
                    let emoji = "☁️"; // 기본 구름
                    if (code === 0) emoji = "☀️"; // 맑음
                    else if (code >= 1 && code <= 3) emoji = "⛅"; // 흐림
                    else if (code >= 51 && code <= 67) emoji = "🌧️"; // 비
                    else if (code >= 71 && code <= 77) emoji = "❄️"; // 눈
                    
                    weatherDisplay.innerText = `${locationName} ${emoji} ${temp}°C`;
                } catch (error) {
                    weatherDisplay.innerText = "날씨 정보 없음";
                }
            }, () => {
                weatherDisplay.innerText = "날씨 정보 없음";
            });
        }
        fetchWeather(); // 시작할 때 한 번 실행

            { type: "harsh", text: "도망친 곳에 낙원은 없다.", original: "逃げ出した先に楽園なんてありゃしねえのさ。", author: "미우라 켄타로" },

            { type: "harsh", text: "인생은 곱셈이다. 내가 제로면 어떤 기회가 와도 의미가 없다.", original: "Life is multiplication. If I am zero, any chance means nothing.", author: "나카무라 미츠루" },
            { type: "harsh", text: "성공의 8할은 일단 출석하는 것이다.", original: "Eighty percent of success is showing up.", author: "우디 알렌" },
            { type: "harsh", text: "네가 헛되이 보낸 오늘은 어제 죽은 이가 그토록 그리던 내일이다.", original: "Today that you wasted is the tomorrow that a dying person wished to live.", author: "소포클레스" },
            { type: "harsh", text: "생각하는 대로 살지 않으면, 결국 사는 대로 생각하게 된다.", original: "If you don't live as you think, you will end up thinking as you live.", author: "폴 부르제" },
            { type: "harsh", text: "실패하는 것은 곧 실패하기로 계획하는 것과 같다.", original: "Failing to plan is planning to fail.", author: "앨런 레이킨" },
            { type: "harsh", text: "쉬운 길은 대개 잘못된 길이다.", original: "The easy way is usually the wrong way.", author: "미상" },
            { type: "harsh", text: "당신이 변하지 않으면, 아무것도 변하지 않는다.", original: "If you do not change, nothing changes.", author: "토니 로빈스" },
            { type: "harsh", text: "게으름은 피곤하기 전에 쉬는 습관일 뿐이다.", original: "Laziness is nothing more than the habit of resting before you get tired.", author: "쥘 르나르" },
            { type: "harsh", text: "오늘을 낭비하는 것은 내일을 훔치는 것이다.", original: "Wasting today is stealing tomorrow.", author: "미상" },
            { type: "harsh", text: "노력하지 않고 얻을 수 있는 것은 가난뿐이다.", original: "The only thing you can achieve without effort is poverty.", author: "미상" },
            { type: "harsh", text: "어제와 똑같이 살면서 다른 내일을 기대하는 것은 정신병이다.", original: "Insanity is doing the same thing and expecting different results.", author: "알베르 아인슈타인" },
            { type: "harsh", text: "나약한 태도는 성격도 나약하게 만든다.", original: "Weakness of attitude becomes weakness of character.", author: "알베르 아인슈타인" },
            { type: "harsh", text: "세상에 공짜는 없다.", original: "There ain't no such thing as a free lunch.", author: "밀턴 프리드먼" },
            { type: "harsh", text: "가장 늦었다고 생각할 때가 진짜 너무 늦은 때다. 그러니 지금 당장 시작하라.", original: "When you think it's late, it is really late. So start right now.", author: "박명수" },
            { type: "harsh", text: "운은 계획에서 비롯된다.", original: "Luck is a matter of preparation meeting opportunity.", author: "루시오스 세네카" },
            { type: "harsh", text: "포기하는 것이 습관이 되면 결코 이길 수 없다.", original: "If quitting becomes a habit, you will never win.", author: "미상" },
            { type: "harsh", text: "지금 잠을 자면 꿈을 꾸지만, 지금 공부하면 꿈을 이룬다.", original: "If you sleep now, you will dream. If you study now, you will achieve your dream.", author: "미상" },
            { type: "harsh", text: "땀 없이는 달콤함도 없다.", original: "No sweat, no sweet.", author: "미상" },
            { type: "harsh", text: "재능이 노력하지 않을 때, 노력이 재능을 이긴다.", original: "Hard work beats talent when talent doesn't work hard.", author: "팀 노키" },
            { type: "harsh", text: "자신을 구원할 사람은 오직 자신뿐이다.", original: "No one saves us but ourselves.", author: "부처" },
            { type: "harsh", text: "실수를 두려워하지 마라. 아무것도 하지 않는 것을 두려워하라.", original: "Do not fear mistakes. Fear a lack of action.", author: "미상" },
            { type: "harsh", text: "자제력이 없는 자는 결코 자유로울 수 없다.", original: "No man is free who cannot command himself.", author: "피타고라스" },
            { type: "harsh", text: "목표가 없는 사람은 목표가 있는 사람을 위해 일하게 된다.", original: "People without goals get used by people who have them.", author: "미상" },
            { type: "harsh", text: "세상은 당신의 변명에 관심이 없다.", original: "The world doesn't care about your excuses.", author: "미상" },
            { type: "harsh", text: "당신의 가치는 당신이 무엇을 하느냐에 달렸다.", original: "Your value is decided by what you do.", author: "미상" },
            { type: "harsh", text: "고통은 지나가지만 아름다움은 남는다.", original: "The pain passes, but the beauty remains.", author: "르누아르" },
            { type: "harsh", text: "인내 없는 지식은 불 없는 촛불과 같다.", original: "Knowledge without patience is like a candle without a fire.", author: "미상" },
            { type: "harsh", text: "아무도 너의 삶을 대신 살아주지 않는다.", original: "No one can live your life for you.", author: "미상" },
            { type: "harsh", text: "불가능은 소심한 자들의 환상일 뿐이다.", original: "Impossible is just an illusion of the timid.", author: "나폴레옹" },
            { type: "harsh", text: "시간은 아무도 기다려주지 않는다.", original: "Time and tide wait for no man.", author: "제프리 초서" },
            { type: "harsh", text: "준비하지 않은 자는 실패를 준비하는 것이다.", original: "By failing to prepare, you are preparing to fail.", author: "벤저민 프랭클린" },
            { type: "harsh", text: "남을 탓하기 전에 자신을 돌아보라.", original: "Look at yourself before blaming others.", author: "미상" },
            { type: "harsh", text: "평범하게 살고 싶지 않다면, 평범하게 노력하지 마라.", original: "If you want the extraordinary, you must not settle for the ordinary.", author: "미상" },
            { type: "harsh", text: "가장 큰 위험은 아무런 위험도 감수하지 않는 것이다.", original: "The biggest risk is not taking any risk.", author: "마크 저커버그" },
            { type: "harsh", text: "행동이 모든 성공의 기본 열쇠이다.", original: "Action is the foundational key to all success.", author: "파블로 피카소" },
            { type: "harsh", text: "오늘이 당신의 남은 인생의 첫날이다.", original: "Today is the first day of the rest of your life.", author: "찰스 디더리치" },
            { type: "harsh", text: "불평하는 시간에 행동하라.", original: "Stop complaining and start doing.", author: "미상" },
            { type: "harsh", text: "최고의 복수는 엄청난 성공이다.", original: "The best revenge is massive success.", author: "프랭크 시나트라" },
            { type: "harsh", text: "승자는 행동으로 증명하고 패자는 말로 변명한다.", original: "Winners prove it with action, losers excuse it with words.", author: "미상" },
            { type: "harsh", text: "스스로를 규율하지 못하는 사람은 남의 규율을 받아야 한다.", original: "He who cannot obey himself will be commanded.", author: "프리드리히 니체" },
            { type: "harsh", text: "세상은 행동하는 자의 것이다.", original: "The world belongs to the doers.", author: "미상" },
            { type: "harsh", text: "시작하지 않으면 결코 끝낼 수 없다.", original: "If you never start, you will never finish.", author: "미상" },
            { type: "harsh", text: "미루는 습관은 시간의 도둑이다.", original: "Procrastination is the thief of time.", author: "에드워드 영" },
            { type: "harsh", text: "재능보다 중요한 것은 태도다.", original: "Your attitude is more important than your aptitude.", author: "미상" },
            { type: "harsh", text: "진짜 실패는 도전하지 않는 것이다.", original: "The only real failure in life is not trying.", author: "미상" },

            // 🇰🇷 뼈를 때리는 한국의 따끔한 명언 추가!
            { type: "harsh", text: "죽고자 하면 살고, 살고자 하면 죽을 것이다.", original: "必死則生 必生則死 (필사즉생 필생즉사)", author: "이순신" },
            { type: "harsh", text: "네가 오늘 하루를 어떻게 보냈는지 생각해봐. 노력 없이 기적이 일어나길 바라는 건 양심이 없는 거지.", original: "행동 없는 요행은 없다", author: "이지영" },
            { type: "harsh", text: "즐겨서 되는 것은 없다. 처절하게 해야 한다.", original: "진정한 노력의 무게", author: "서장훈" },
            { type: "harsh", text: "모든 것은 기본기에서 시작된다. 요행을 바라지 마라.", original: "기본기(基本技)의 중요성", author: "손웅정" },
            { type: "harsh", text: "백 번 듣는 것이 한 번 보는 것만 못하다.", original: "百聞 不如一見 (백문이 불여일견)", author: "한국 속담" }
        ];

        // --- 4. 앱 동작 로직 (화면 이동 및 랜덤 뽑기) ---
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function goHome() {
            switchView('view-start');
        }

        function startGacha() {
            // 로딩 화면 표시
            switchView('view-loading');

            // 1.5초 뒤에 결과 화면 표시
            setTimeout(() => {
                showResults();
            }, 1500);
        }

        function showResults() {
            const container = document.getElementById('result-container');
            container.innerHTML = ""; // 기존 결과 지우기

            // 50% 확률로 명언 종류(따뜻한맛 or 따끔한맛) 결정!
            const isHarsh = Math.random() < 0.5; // 0.5보다 작으면 true(반반 확률)
            const targetType = isHarsh ? "harsh" : "positive";

            // 결정된 종류의 명언들만 골라내기
            const filteredQuotes = quotesData.filter(q => q.type === targetType);
            
            // 고른 명언들 중에서 딱 1개만 랜덤 선택!
            const randomIndex = Math.floor(Math.random() * filteredQuotes.length);
            const quote = filteredQuotes[randomIndex];

            // 네이버 검색 링크 생성 (의도: 인물 검색)
            const searchLink = `https://search.naver.com/search.naver?query=${encodeURIComponent(quote.author)}`;

            // 스케치 모양에 맞춘 명언 카드 HTML 생성 (원문 추가됨!)
            const cardHTML = `
                <a href="${searchLink}" target="_blank" rel="noopener noreferrer" class="quote-card" title="${quote.author} 검색해보기">
                    <div class="quote-original">${quote.original}</div>
                    <div class="quote-text">"${quote.text}"</div>
                    <div class="quote-author">- ${quote.author} -</div>
                </a>
            `;
            container.innerHTML = cardHTML;

            // 결과 화면으로 전환
            switchView('view-result');
        }
    </script>
