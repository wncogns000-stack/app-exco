<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>기분 · 준비 중</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#e3dfd6; --accent:#e8612c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181b; --card:#212327; --ink:#eceae6; --muted:#a3a39f; --line:#33363b; --accent:#ff8a57; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); word-break:keep-all;
         font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:28px 16px 48px; }
  .tag { display:inline-block; font-size:13px; font-weight:700; color:#fff; background:var(--accent);
         padding:5px 12px; border-radius:999px; }
  h1 { font-size:30px; margin:14px 0 6px; letter-spacing:-0.5px; }
  p.lead { margin:0 0 22px; color:var(--muted); font-size:15px; line-height:1.55; }

  .box { margin-top:18px; padding:22px 18px; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .box b { font-size:20px; }
  .box p { margin:8px 0 0; color:var(--muted); line-height:1.6; }
  a.back { display:inline-block; margin-top:18px; color:var(--accent); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<main>
  <span class="tag">6학년 미술 · 애플리케이션 제작</span>
  <h1>기분</h1>
  <p class="lead">개발자 · 박지수</p>
  <div class="box"><b>앱을 손보는 중이에요</b><p>곧 이 QR코드로 바로 열 수 있어요. 조금만 기다려 주세요!</p></div>
  <a class="back" href="./">‹ 다른 앱 구경하기</a>
</main>
</body>
</html>
