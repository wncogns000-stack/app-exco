<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>너의 과일상태</title>
    <!-- Tailwind CSS 및 폰트, 아이콘 라이브러리 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 기본 글꼴 적용 (칠판 느낌의 귀여운 개구체) */
        body {
            font-family: 'Gaegu', cursive;
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        /* 📱 스마트폰 외곽선 프레임 */
        .phone-container {
            width: 375px;
            height: 720px;
            background-color: #FEF9C3; /* 상큼한 연노랑 */
            border: 12px solid #1e293b;
            border-radius: 45px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 🌈 무지개 & 그라데이션 배경 (연푸른색 -> 연노랑) */
        .app-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #E0F2FE 0%, #FEF9C3 100%);
            z-index: 0;
        }

        .app-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        /* 타이틀 글자 색상 (2글자씩 다르게 알록달록 무지개 컬러) */
        .title-text span:nth-child(1) { color: #FF6B6B; } /* 너만 */
        .title-text span:nth-child(2) { color: #4D96FF; } /* 의과 */
        .title-text span:nth-child(3) { color: #6BCB77; } /* 일을 */
        .title-text span:nth-child(4) { color: #FFD93D; } /* 골라 */
        .title-text span:nth-child(5) { color: #FF8080; } /* 줄께! */

        /* 🔘 기기전용 입체감 있는 버튼 디자인 */
        .btn-status {
            background-color: white;
            border: 3px solid #93c5fd;
            border-radius: 20px;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 5px 0 #93c5fd;
            transition: all 0.1s ease-in-out;
            cursor: pointer;
        }
        .btn-status:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #93c5fd;
        }

        /* 🧭 하단 스마트폰 네비게이션 바 */
        .nav-bar {
            height: 60px;
            background-color: white;
            border-top: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 22px;
            z-index: 10;
        }
        .nav-btn {
            color: #64748b;
            transition: color 0.2s;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .nav-btn:active {
            color: #3b82f6;
        }

        /* 🔄 로딩 스피너 애니메이션 */
        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3b82f6;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .hidden { display: none !important; }

        /* 팝업 창 애니메이션 */
        .menu-popup {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <div class="app-background"></div>

                        </svg>
                    </div>
                    <!-- 바나나 -->
                    <div class="w-20 h-20 flex justify-center items-center hover:scale-110 transition duration-300">
                        <svg viewBox="0 0 100 100" class="w-full h-full">
                            <path d="M20,20 C40,25 80,40 80,75 C80,85 70,90 60,80 C45,65 30,45 15,25 Z" fill="#fbbf24"/>
                            <path d="M15,25 C14,21 17,17 20,20 Z" fill="#78350f"/>

                    </div>
                    <!-- 오렌지 -->

                        <svg viewBox="0 0 100 100" class="w-full h-full">

                            <circle cx="50" cy="55" r="27" fill="#fb923c"/>
                            <!-- 잎사귀 -->
                            <path d="M50,25 C50,15 60,10 65,15 C65,25 55,25 50,25 Z" fill="#15803d"/>

                            <circle cx="65" cy="50" r="1.5" fill="#ea580c"/>

                            <circle cx="55" cy="40" r="1.5" fill="#ea580c"/>

                <!-- 💬 귀여운 안내 말풍선 -->

        <!-- 🍔 숨겨진 슬라이드 메뉴 팝업 -->

                        <button onclick="toggleMenu()" class="text-2xl text-slate-500"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <ul class="space-y-4 text-xl">

            </button>

    <!-- 팝업 메시지 모달 (alert 우회용 스마트폰용 커스텀 모달) -->

                img: `
                <svg viewBox="0 0 100 100" class="w-24 h-24">
                    <circle cx="50" cy="50" r="40" fill="#f97316"/>
                    <circle cx="50" cy="50" r="36" fill="#fb923c"/>

            },
            {

        /* ==============================================
         * 2. 시간 및 날씨 제어 (안전장치 탑재)
         * ============================================== */
        function initApp() {
            updateClock();
            setInterval(updateClock, 1000);
            updateWeather();
        }

        // 시계 업데이트 기능
        function updateClock() {
            const now = new Date();
            const hrs = now.getHours().toString().padStart(2, '0');
            const mins = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock-display').innerText = `${hrs}:${mins}`;
        }

        // 실시간 날씨 연동 (실패해도 절대 멈추지 않는 완벽한 안전장치)
        function updateWeather() {
            const weatherDiv = document.getElementById('weather-display');
            if (navigator.geolocation) {
                // 위치 서비스 응답 지연을 방지하기 위한 3초 타임아웃
                const fallbackTimeout = setTimeout(() => {
                    weatherDiv.innerHTML = `<i class="fa-solid fa-sun text-orange-500"></i> 서울 ☀️ 24°C`;
                }, 3000);

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        clearTimeout(fallbackTimeout);
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                            .then(res => res.json())
                            .then(data => {
                                const temp = Math.round(data.current_weather.temperature);
                                const code = data.current_weather.weathercode;
                                let emoji = "☀️";
                                if(code > 0) emoji = "☁️";
                                if(code > 50) emoji = "🌧️";
                                weatherDiv.innerHTML = `<i class="fa-solid fa-location-dot text-blue-500"></i> 동네 ${emoji} ${temp}°C`;
                            })
                            .catch(() => {
                                weatherDiv.innerHTML = `<i class="fa-solid fa-sun text-orange-500"></i> 서울 ☀️ 24°C`;
                            });
                    },
                    () => {
                        clearTimeout(fallbackTimeout);
                        weatherDiv.innerHTML = `<i class="fa-solid fa-sun text-orange-500"></i> 서울 ☀️ 24°C`;
                    },
                    { timeout: 3000 }
                );
            } else {
                weatherDiv.innerHTML = `<i class="fa-solid fa-sun text-orange-500"></i> 서울 ☀️ 24°C`;
            }
        }

        /* ==============================================
         * 3. 3단계 앱 전환 로직 (딜레이 없이 즉각 반응!)
         * ============================================== */
        let currentScreen = 'start';

        function startAnalyze(selectedState) {
            // 시작 화면 숨기고 로딩 화면 켜기
            document.getElementById('step-start').classList.add('hidden');
            document.getElementById('step-loading').classList.remove('hidden');
            currentScreen = 'loading';

            // 1.5초 후 자동으로 결과 화면 출력 (지루하지 않게!)
            setTimeout(() => {
                showResults(selectedState);
            }, 1500);
        }

        function showResults(state) {
            document.getElementById('step-loading').classList.add('hidden');
            const resultScreen = document.getElementById('step-result');
            resultScreen.classList.remove('hidden');
            currentScreen = 'result';

            // 해당 조건에 맞는 과일 추출
            let recommendations = fruitDB.filter(item => item.category === state);
            
            // 만약 일치하는게 없다면 기본 과일 추천
            if (recommendations.length === 0) {
                recommendations = fruitDB;
            }

            // 무작위로 섞어서 2가지 선정 (자바스크립트의 랜덤 함수 활용)
            const randomPick = recommendations.sort(() => 0.5 - Math.random()).slice(0, 2);

            const container = document.getElementById('result-container');
            container.innerHTML = "";

            randomPick.forEach(fruit => {
                const card = document.createElement('div');
                card.className = "bg-white/90 p-5 rounded-3xl border-2 border-blue-200 shadow-md flex flex-col items-center";
                card.innerHTML = `
                    <div class="mb-2 transform hover:scale-110 transition duration-300">
                        ${fruit.img}
                    </div>
                    <h3 class="text-3xl font-bold text-blue-600 mb-1">${fruit.name}</h3>
                    <p class="text-lg text-slate-700 leading-tight mb-4 px-2 font-medium">${fruit.reason}</p>
                    <div class="flex gap-2 w-full">
                        <a href="https://search.shopping.naver.com/search/all?query=${fruit.name}" target="_blank" rel="noopener noreferrer" 
                           class="flex-1 bg-yellow-400 py-3 rounded-2xl font-bold text-center text-sm shadow-sm hover:bg-yellow-500 active:translate-y-1 block">
                           🛍️ 쇼핑하기
                        </a>
                        <a href="https://map.naver.com/v5/search/${fruit.name}" target="_blank" rel="noopener noreferrer" 
                           class="flex-1 bg-blue-400 text-white py-3 rounded-2xl font-bold text-center text-sm shadow-sm hover:bg-blue-500 active:translate-y-1 block">
                           📍 지도찾기
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });

            // 추가 응원 메시지 카드
            const cheerCard = document.createElement('div');
            cheerCard.className = "text-center text-xl text-blue-600 font-extrabold py-2 animate-bounce mt-4";
            cheerCard.innerText = "오늘도 맛있는 과일 먹고 힘내자! 💛";
            container.appendChild(cheerCard);
        }

        // 앱 처음으로 초기화 (홈 버튼 동작)
        function resetApp() {
            document.getElementById('step-start').classList.remove('hidden');
            document.getElementById('step-loading').classList.add('hidden');
            document.getElementById('step-result').classList.add('hidden');
            currentScreen = 'start';
        }

        // 뒤로가기 동작
        function goBack() {
            if (currentScreen === 'result' || currentScreen === 'loading') {
                resetApp();
            } else {
                openCustomModal("처음 화면입니다", "몸 상태를 선택해 오늘의 맞춤 과일을 알아보세요! 😉");
            }
        }

        /* ==============================================
         * 4. 사이드 슬라이드 메뉴 & 알림 모달 기능
         * ============================================== */
        function toggleMenu() {
            const sideMenu = document.getElementById('side-menu');
            if (sideMenu.classList.contains('hidden')) {
                sideMenu.classList.remove('hidden');
            } else {
                sideMenu.classList.add('hidden');
            }
        }

        function openCustomModal(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function alertInfo(type) {
            toggleMenu(); // 메뉴 닫기
            if (type === 'diet') {
                openCustomModal("어린이 건강 꿀팁 🍎", "과일은 즙으로 먹는 것보다 생과일 그대로 씹어 먹는 것이 건강과 치아에 훨씬 더 좋답니다!");
            } else if (type === 'maker') {
                openCustomModal("만든 사람 소개 🎨", "이 앱은 어린이의 소중하고 귀여운 아이디어 구상도를 바탕으로 만들어진 전 세계에 하나뿐인 '너의 과일상태' 앱입니다!");
            }
        }

        // 앱 실행 시작
        window.onload = initApp;
    </script>
<div id="expo-credit" role="note" aria-label="개발자 최주현" style="all:initial;position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2147483647;pointer-events:none;display:block;box-sizing:border-box;padding:4px 11px;border-radius:999px;background:rgba(17,24,39,.82);color:#fff;font:600 12px/1.35 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.2px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25)">개발자 · 최주현</div>
