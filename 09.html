<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 웅장한 달빛 애니메이션 */
        @keyframes glow {
            0% { box-shadow: 0 0 20px #fbbf24, 0 0 40px #f59e0b; }
            50% { box-shadow: 0 0 40px #fcd34d, 0 0 80px #fbbf24; }
            100% { box-shadow: 0 0 20px #fbbf24, 0 0 40px #f59e0b; }
        }
        .moon-glow {
            animation: glow 3s infinite alternate;
        }
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spin-slow {
            animation: spin-slow 8s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">

    <!-- 스마트폰 기기 UI -->
    <div id="smartphone" class="relative w-[360px] h-[720px] bg-slate-900 overflow-hidden shadow-2xl rounded-[40px] border-[8px] border-gray-800 flex flex-col text-white">
        
        <!-- 상단 상태바 (시계, 날씨, 위치) -->
        <div class="flex justify-between items-center px-6 py-3 text-xs text-gray-300 bg-slate-900/80 backdrop-blur-sm z-20">
            <span id="current-time" class="font-bold">00:00</span>
            <div class="flex space-x-2">
                <span id="location-weather">📍 위치 찾는 중...</span>
            </div>
        </div>

        <!-- 메인 콘텐츠 영역 -->
        <div class="flex-1 relative overflow-y-auto pb-16 scrollbar-hide" id="content-area">
            
            <!-- 1단계: 시작 화면 -->
            <div id="screen-start" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500">
                <h1 class="text-3xl font-extrabold text-white mb-2 drop-shadow-md">달찾기</h1>
                <p class="text-sm text-gray-300 mb-10">밤하늘의 숨겨진 달을 찾아줄게!</p>
                
                <!-- 웅장한 노란색 달 -->
                <div class="w-48 h-48 bg-yellow-400 rounded-full moon-glow mb-12 flex items-center justify-center relative">
                    <div class="absolute w-12 h-12 bg-yellow-500 rounded-full opacity-30 top-6 left-8"></div>
                    <div class="absolute w-8 h-8 bg-yellow-500 rounded-full opacity-40 bottom-10 right-10"></div>
                    <div class="absolute w-16 h-16 bg-yellow-600 rounded-full opacity-20 top-20 right-6"></div>
                    <span class="text-6xl">🌕</span>
                </div>

                <!-- 빨간색 버튼 -->
                <button onclick="startFinding()" class="bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold py-4 px-10 rounded-full shadow-lg transform transition active:scale-95 text-lg w-full">
                    달 찾기 시작! 🚀
                </button>
            </div>

            <!-- 2단계: 분석(로딩) 화면 (기본 숨김) -->
            <div id="screen-loading" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center hidden opacity-0 transition-opacity duration-500">
                <div class="text-6xl mb-6 spin-slow">🧭</div>
                <h2 class="text-2xl font-bold text-yellow-400 mb-4">달빛 추적 중...</h2>
                <p class="text-gray-300">현재 위치에서 달을 보기 <br>가장 좋은 장소를 찾고 있어요!</p>
                <div class="mt-8 flex space-x-2">
                    <div class="w-3 h-3 bg-red-500 rounded-full animate-bounce"></div>
                    <div class="w-3 h-3 bg-red-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                    <div class="w-3 h-3 bg-red-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                </div>
            </div>

            <!-- 3단계: 결과 화면 (기본 숨김) -->
            <div id="screen-result" class="absolute inset-0 flex flex-col p-6 hidden opacity-0 transition-opacity duration-500 overflow-y-auto">
                <div class="text-center mb-6">
                    <div class="text-4xl mb-2">🔭</div>
                    <h2 class="text-2xl font-bold text-yellow-400">달맞이 명소 발견!</h2>
                    <p class="text-sm text-gray-300 mt-2">이곳에서 아름다운 달을 만나봐요.</p>
                </div>
                
                <!-- 추천 결과가 여기에 표시됨 -->
                <div id="result-container" class="space-y-4 pb-4">
                    <!-- 자바스크립트로 채워짐 -->
                </div>
            </div>

            <!-- 메뉴 화면 (오버레이, 기본 숨김) -->
            <div id="screen-menu" class="absolute inset-0 bg-slate-800 p-6 hidden flex-col transition-transform duration-300 translate-y-full z-10">
                <h2 class="text-2xl font-bold text-white mb-6 border-b border-gray-600 pb-4">메뉴</h2>
                <ul class="space-y-4 text-lg">
                    <li class="p-3 bg-slate-700 rounded-xl hover:bg-slate-600 cursor-pointer" onclick="closeMenu()">🌕 나의 달찾기 기록</li>
                    <li class="p-3 bg-slate-700 rounded-xl hover:bg-slate-600 cursor-pointer" onclick="closeMenu()">⭐ 앱 설정</li>
                    <li class="p-3 bg-slate-700 rounded-xl hover:bg-slate-600 cursor-pointer" onclick="closeMenu()">💌 개발자에게 편지쓰기</li>
                </ul>
                <button onclick="closeMenu()" class="mt-auto bg-red-600 text-white py-3 rounded-xl font-bold w-full">닫기</button>
            </div>

        </div>

        <!-- 하단 네비게이션 바 -->
        <div class="bg-slate-900 border-t border-gray-800 flex justify-around items-center py-4 px-2 z-20">
            <button onclick="toggleMenu()" class="text-gray-400 hover:text-yellow-400 text-2xl transition"><span class="block mb-1">☰</span></button>
            <button onclick="goHome()" class="text-gray-400 hover:text-yellow-400 text-3xl transition"><span class="block mb-1">⌂</span></button>
            <button onclick="goBack()" class="text-gray-400 hover:text-yellow-400 text-2xl transition"><span class="block mb-1">◁</span></button>
        </div>
    </div>

    <script>
        // --- 데이터 준비 (10개 이상의 현실적인 추천 장소) ---
        const moonSpots = [
            { name: '호수공원', reason: '물결에 비친 달빛이 정말 아름다울 거야! 찰랑이는 물소리와 함께 달구경 어때?' },
            { name: '시민 천문대', reason: '달 표면의 크레이터까지 또렷하게 볼 수 있는 최고의 장소지! 별은 보너스야.' },
            { name: '하늘공원', reason: '높은 곳에서 탁 트인 밤하늘을 볼 수 있어. 커다란 달이 널 반겨줄 거야!' },
            { name: '달맞이길', reason: '이름부터 달을 맞이하는 곳이잖아! 산책하며 달빛을 흠뻑 느껴봐.' },
            { name: '강변 유원지', reason: '시원한 강바람을 맞으며 웅장한 노란 달을 감상할 수 있는 낭만적인 곳이야.' },
            { name: '동네 뒷산 전망대', reason: '가깝고 조용해서 나만의 달구경 명소로 딱이지! 따뜻한 겉옷 챙겨가면 어떨까?' },
            { name: '루프탑 카페', reason: '따뜻한 음료를 마시며 편안하게 예쁜 달을 볼 수 있어. 분위기 최고!' },
            { name: '야간개장 궁궐', reason: '고풍스러운 전각 위로 떠오른 달을 보면 마치 옛날 이야기 속 주인공이 된 기분일 거야.' },
            { name: '근린공원 정자', reason: '운치 있는 정자에 앉아 밤하늘을 올려다보며 달멍(달 보며 멍때리기)하기 좋은 곳이야.' },
            { name: '생태 산책로', reason: '풀벌레 소리를 들으며 달빛 아래를 걷다 보면 마음이 무척 편안해질 거야.' },
            { name: '남산 타워', reason: '멋진 야경과 함께 어우러진 웅장한 달을 볼 수 있는 최고의 뷰 포인트!' },
            { name: '바닷가 방파제', reason: '탁 트인 바다 위로 둥실 떠오른 달은 정말 환상적이거든! 파도 소리도 듣기 좋아.' }
        ];

        // --- 화면 전환 기록 변수 ---
        let historyStack = ['start'];

        // --- 시계 및 날씨/위치 세팅 ---
        function updateTime() {
            const now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').innerText = `${h}:${m}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 날씨 아이콘 변환기
        function getWeatherEmoji(code) {
            if (code === 0) return '☀️'; // 맑음
            if (code >= 1 && code <= 3) return '⛅'; // 구름조금~많음
            if (code >= 45 && code <= 48) return '🌫️'; // 안개
            if (code >= 51 && code <= 67) return '🌧️'; // 비
            if (code >= 71 && code <= 77) return '❄️'; // 눈
            if (code >= 95 && code <= 99) return '⛈️'; // 뇌우
            return '☁️';
        }

        // 위치 및 날씨 가져오기
        function fetchLocationAndWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        try {
                            // 1. 역지오코딩 (좌표 -> 주소 변환) - OpenStreetMap 무료 API
                            const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                            const geoData = await geoRes.json();
                            let city = geoData.address.city || geoData.address.town || geoData.address.borough || '현재 위치';

                            // 2. 날씨 정보 가져오기 - Open-Meteo 무료 API
                            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                            const weatherData = await weatherRes.json();
                            
                            const temp = Math.round(weatherData.current_weather.temperature);
                            const weatherCode = weatherData.current_weather.weathercode;
                            const emoji = getWeatherEmoji(weatherCode);

                            document.getElementById('location-weather').innerText = `📍 ${city} ${emoji} ${temp}°C`;
                        } catch (error) {
                            document.getElementById('location-weather').innerText = '📍 위치 확인 완료 (날씨 정보 없음)';
                        }
                    },
                    (error) => {
                        document.getElementById('location-weather').innerText = '📍 날씨 정보 없음';
                    }
                );
            } else {
                document.getElementById('location-weather').innerText = '📍 기능 지원 안됨';
            }
        }
        fetchLocationAndWeather();

        // --- 앱 동작 로직 ---
        function switchScreen(screenId) {
            const screens = ['screen-start', 'screen-loading', 'screen-result'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (id === screenId) {
                    el.classList.remove('hidden');
                    // 약간의 지연 후 투명도 조절로 애니메이션 효과
                    setTimeout(() => el.classList.remove('opacity-0'), 50);
                } else {
                    el.classList.add('opacity-0');
                    setTimeout(() => el.classList.add('hidden'), 500);
                }
            });
            // 히스토리 관리 (뒤로가기를 위해)
            if (historyStack[historyStack.length - 1] !== screenId.replace('screen-', '')) {
                historyStack.push(screenId.replace('screen-', ''));
            }
        }

        function startFinding() {
            switchScreen('screen-loading');
            
            // 2.5초 후 결과 화면으로 이동
            setTimeout(() => {
                showResults();
            }, 2500);
        }

        function showResults() {
            const container = document.getElementById('result-container');
            container.innerHTML = ''; // 초기화

            // 배열 섞기 (랜덤)
            const shuffled = [...moonSpots].sort(() => 0.5 - Math.random());
            // 2~3개 뽑기
            const count = Math.floor(Math.random() * 2) + 2; 
            const selectedSpots = shuffled.slice(0, count);

            selectedSpots.forEach((spot, index) => {
                const delay = index * 200; // 순차적 나타남 효과
                // 네이버 지도 검색 URL 생성
                const mapUrl = `https://map.naver.com/v5/search/${encodeURIComponent(spot.name)}`;
                
                const cardHtml = `
                    <div class="bg-slate-800 rounded-2xl p-5 shadow-lg border border-slate-700 transform transition hover:scale-105 opacity-0 animate-fade-in" style="animation: fadeIn 0.5s ease forwards ${delay}ms;">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl font-bold text-yellow-300">🌕 ${spot.name}</h3>
                        </div>
                        <p class="text-gray-300 text-sm mb-4 leading-relaxed">${spot.reason}</p>
                        
                        <!-- 네이버 지도 연결 버튼 -->
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="inline-block w-full text-center bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-xl transition">
                            📍 네이버 지도에서 길찾기
                        </a>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            switchScreen('screen-result');
        }

        // --- 네비게이션 및 메뉴 로직 ---
        function goHome() {
            historyStack = ['start'];
            switchScreen('screen-start');
            closeMenu();
        }

        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop(); // 현재 화면 제거
                const prevScreen = historyStack[historyStack.length - 1]; // 이전 화면
                switchScreen('screen-' + prevScreen);
            }
            closeMenu();
        }

        const menuEl = document.getElementById('screen-menu');
        function toggleMenu() {
            if (menuEl.classList.contains('hidden')) {
                menuEl.classList.remove('hidden');
                setTimeout(() => menuEl.classList.remove('translate-y-full'), 10);
            } else {
                closeMenu();
            }
        }
        function closeMenu() {
            menuEl.classList.add('translate-y-full');
            setTimeout(() => menuEl.classList.add('hidden'), 300);
        }

        // --- 추가 CSS 애니메이션 ---
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in {
                transform: translateY(20px);
            }
        `;
        document.head.appendChild(style);
    </script>
<div id="expo-credit" role="note" aria-label="개발자 서연우" style="all:initial;position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2147483647;pointer-events:none;display:block;box-sizing:border-box;padding:4px 11px;border-radius:999px;background:rgba(17,24,39,.82);color:#fff;font:600 12px/1.35 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.2px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25)">개발자 · 서연우</div>
</body>
</html>
