        id: 49,
        title: "바삭바삭 김말이 튀김",
        category: "분식",
        emoji: "🍙",
        time: "10분",
        desc: "김 속에 양념된 당면을 쏙 넣어 튀겨낸 분식집 대표 튀김!",
        ingredients: ["김밥용 김", "당면", "간장", "참기름", "튀김가루"],
        steps: ["삶은 당면에 간장과 참기름으로 간을 합니다.", "김에 당면을 말아 말아준 뒤 튀김옷을 입혀 튀겨냅니다."],
        saved: false,
        my: false
      },
      {
        id: 50,
        title: "촉촉 스윗 프렌치 토스트",
        category: "디저트",
        emoji: "🍞",
        time: "6분",
        desc: "계란물에 폭 적신 식빵을 버터에 구워 슈가파우더를 뿌려 완성!",
        ingredients: ["식빵", "계란 2개", "우유", "버터", "슈가파우더"],
        steps: ["계란과 우유를 섞어 반죽을 만든 뒤 식빵을 충분히 적십니다.", "버터 두른 팬에 약불로 노릇하게 구운 후 슈가파우더를 솔솔 뿌립니다."],
        saved: false,
        my: false
      }
    ];

    // Navigation History for Hardware Back Button
    let historyStack = ['main'];
    let currentTab = 'home';

    // Real-time Clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-display').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // App Navigation Functions
    function renderView(htmlContent, pushState = true) {
      const appContainer = document.getElementById('app-content');
      appContainer.innerHTML = htmlContent;
      appContainer.scrollTop = 0;
    }

    function goHome() {
      historyStack = ['main'];
      currentTab = 'home';
      updateTabStyles();
      showMainView();
    }

    function goBack() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prevView = historyStack[historyStack.length - 1];
        if (prevView === 'main') showMainView(false);
        else if (prevView.startsWith('detail-')) {
          const id = parseInt(prevView.split('-')[1]);
          showDetailView(id, false);
        } else if (prevView === 'saved') showSavedView(false);
        else if (prevView === 'my') showMyView(false);
        else if (prevView === 'add') showAddView(false);
      } else {
        showMainView(false);
      }
    }

    function updateTabStyles() {
      document.getElementById('tab-saved').className = `flex flex-col items-center ${currentTab === 'saved' ? 'text-amber-500 font-bold' : 'text-slate-500'}`;
      document.getElementById('tab-my').className = `flex flex-col items-center ${currentTab === 'my' ? 'text-amber-500 font-bold' : 'text-slate-500'}`;
    }

    function switchTab(tab) {
      currentTab = tab;
      updateTabStyles();
      if (tab === 'saved') showSavedView();
      else if (tab === 'my') showMyView();
      else if (tab === 'add') showAddView();
    }

    // --- STEP 1: Main View (Search & List) ---
    function showMainView(push = true) {
      if (push) historyStack.push('main');
      currentTab = 'home';
      updateTabStyles();

      // Pick 3 Random Recommended Recipes
      const shuffled = [...recipeDatabase].sort(() => 0.5 - Math.random());
      const randomRecommendations = shuffled.slice(0, 3);

      const html = `
        <div class="space-y-4">
          <!-- Search Bar (스케치 1번 반영) -->
          <div class="bg-white p-2 rounded-2xl shadow-sm border border-amber-200 flex items-center space-x-2">
            <i class="fa-solid fa-magnifying-glass text-amber-500 text-lg ml-2"></i>
            <input id="search-input" type="text" placeholder="어떤 요리의 레시피가 궁금해?" 
              class="w-full bg-transparent outline-none text-sm text-slate-700 placeholder-slate-400 font-medium"
              onkeypress="if(event.key==='Enter') executeSearch()">
            <button onclick="executeSearch()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition active:scale-95 shrink-0">
              검색
            </button>
          </div>

          <!-- Banner / Notice -->
          <div class="bg-gradient-to-r from-amber-400 to-orange-400 rounded-2xl p-3.5 text-white shadow-md flex items-center justify-between">
            <div>
              <p class="text-[11px] opacity-90 font-medium">유튜브처럼 쉬운 레시피!</p>
              <h2 class="font-bold text-sm mt-0.5">🍳 내 입맛대로 요리하자!</h2>
            </div>
            <span class="text-3xl animate-bounce">👩‍🍳</span>
          </div>

          <!-- Random Recommendation Section Header -->
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-slate-800 text-sm flex items-center">
              <i class="fa-solid fa-wand-magic-sparkles text-amber-500 mr-1.5"></i>오늘의 랜덤 추천 레시피!
            </h3>
            <button onclick="showMainView(false)" class="text-[11px] text-amber-600 font-bold hover:underline">
              <i class="fa-solid fa-rotate mr-0.5"></i>새로고침
            </button>
          </div>

          <!-- Recipe List Cards (스케치 리스트 구조 반영) -->
          <div class="space-y-3">
            ${randomRecommendations.map(item => `
              <div onclick="startAnalysis(${item.id})" class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex items-center space-x-3 cursor-pointer hover:border-amber-300 transition active:scale-98">
                <div class="w-16 h-16 bg-amber-100 rounded-xl flex items-center justify-center text-3xl shrink-0 shadow-inner">
                  ${item.emoji}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between">
                    <h4 class="font-bold text-slate-800 text-sm truncate">${item.title}</h4>
                    <span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold shrink-0">${item.time}</span>
                  </div>
                  <p class="text-xs text-slate-500 line-clamp-2 mt-1">${item.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- All Recipe List -->
          <h3 class="font-bold text-slate-800 text-sm pt-2">📖 전체 레시피 둘러보기 (${recipeDatabase.length}개)</h3>
          <div class="grid grid-cols-2 gap-2.5">
            ${recipeDatabase.map(item => `
              <div onclick="startAnalysis(${item.id})" class="bg-white p-2.5 rounded-xl border border-slate-100 text-center cursor-pointer hover:border-amber-400 transition active:scale-95 shadow-xs">
                <div class="text-2xl mb-1">${item.emoji}</div>
                <div class="font-bold text-xs text-slate-800 truncate">${item.title}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">${item.category}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      renderView(html);
    }

    // Search Trigger Function
    function executeSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) {
        alert("검색어를 입력해 줘!");
        return;
      }
      const filtered = recipeDatabase.filter(r => r.title.includes(query) || r.category.includes(query) || r.desc.includes(query));
      
      if (filtered.length === 0) {
        renderView(`
          <div class="text-center py-12 space-y-3">
            <div class="text-4xl">🧐</div>
            <p class="text-sm font-bold text-slate-700">'${query}'에 대한 레시피가 없어!</p>
            <p class="text-xs text-slate-400">다른 이름으로 검색하거나 새로운 레시피를 등록해보자!</p>
            <button onclick="showMainView(false)" class="mt-2 bg-amber-500 text-white text-xs px-4 py-2 rounded-xl font-bold">전체 목록으로</button>
          </div>
        `);
      } else {
        const item = filtered[Math.floor(Math.random() * filtered.length)];
        startAnalysis(item.id);
      }
    }

    // --- STEP 2: Loading / Analysis View ---
    function startAnalysis(recipeId) {
      const recipe = recipeDatabase.find(r => r.id === recipeId);
      
      const loadingHtml = `
        <div class="h-full flex flex-col items-center justify-center text-center py-16 space-y-4">
          <div class="relative w-20 h-20 flex items-center justify-center">
            <div class="absolute inset-0 border-4 border-amber-200 border-t-amber-500 rounded-full animate-spin"></div>
            <span class="text-3xl">${recipe.emoji}</span>
          </div>
          <div>
            <h3 class="font-bold text-slate-800 text-base">'${recipe.title}'</h3>
            <p class="text-xs text-amber-600 font-medium mt-1 animate-pulse">맛있는 레시피 분석 중...</p>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 text-xs text-slate-500 max-w-[240px]">
            💡 팁: '내 입맛대로' 앱에서는 필요 재료를 바로 쇼핑으로 구매할 수 있어!
          </div>
        </div>
      `;
      renderView(loadingHtml, false);

      setTimeout(() => {
        showDetailView(recipeId);
      }, 1200);
    }

    // --- STEP 3: Result & Detail View (스케치 2번 결과 화면 완벽 구현) ---
    function showDetailView(recipeId, push = true) {
      if (push) historyStack.push(`detail-${recipeId}`);
      const recipe = recipeDatabase.find(r => r.id === recipeId);

      const html = `
        <div class="space-y-4 pb-4">
          <!-- Top Title & Search Result Style (스케치 2번 상단 파트) -->
          <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-amber-200 flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="text-xl">${recipe.emoji}</span>
              <span class="font-bold text-slate-800 text-sm">${recipe.title}</span>
            </div>
            <button onclick="toggleSave(${recipe.id})" class="text-amber-500 text-lg hover:scale-110 transition active:scale-90 px-2">
              <i class="${recipe.saved ? 'fa-solid' : 'fa-regular'} fa-bookmark"></i>
            </button>
          </div>

          <!-- Recipe Image & Description Box (스케치 2번 그림과 텍스트 박스) -->
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
            <div class="w-full h-36 bg-amber-100 rounded-xl flex flex-col items-center justify-center text-center p-3 relative overflow-hidden">
              <span class="text-5xl mb-1">${recipe.emoji}</span>
              <h3 class="font-bold text-slate-800 text-lg">${recipe.title} 레시피!</h3>
              <span class="absolute top-2 right-2 bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">⏱️ ${recipe.time}</span>
            </div>

            <!-- Friendly Recommendation Reason -->
            <div class="bg-amber-50 p-3 rounded-xl text-xs text-slate-700 leading-relaxed border border-amber-100">
              <span class="font-bold text-amber-700">🥰 아이 추천 이유:</span><br>
              ${recipe.desc} 쉽고 간단해서 누구나 맛있게 완성할 수 있어!
            </div>
          </div>

          <!-- Ingredients & Naver Shopping Link Integration (질문 4번 의도 세팅) -->
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2">
            <h4 class="font-bold text-slate-800 text-xs flex items-center justify-between">
              <span>🛒 필요한 재료 (클릭 시 네이버 쇼핑 연결)</span>
              <span class="text-[10px] text-amber-600 font-normal">네이버 쇼핑 <i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </h4>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${recipe.ingredients.map(ing => `
                <a href="https://search.shopping.naver.com/search/all?query=${encodeURIComponent(ing)}" target="_blank" rel="noopener noreferrer"
                  class="bg-slate-100 hover:bg-amber-100 text-slate-700 hover:text-amber-800 text-xs px-2.5 py-1 rounded-lg border border-slate-200 transition flex items-center space-x-1">
                  <span>${ing}</span>
                  <i class="fa-solid fa-bag-shopping text-[10px] text-amber-500"></i>
                </a>
              `).join('')}
            </div>
          </div>

          <!-- Cooking Steps -->
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2">
            <h4 class="font-bold text-slate-800 text-xs">👨‍🍳 순서대로 요리하기</h4>
            <ol class="space-y-2 text-xs text-slate-600">
              ${recipe.steps.map((step, idx) => `
                <li class="flex items-start space-x-2">
                  <span class="bg-amber-500 text-white font-bold w-4 h-4 rounded-full flex items-center justify-center text-[10px] shrink-0 mt-0.5">${idx + 1}</span>
                  <span>${step}</span>
                </li>
              `).join('')}
            </ol>
          </div>

          <!-- Buttons -->
          <div class="flex space-x-2 pt-1">
            <button onclick="toggleSave(${recipe.id})" class="flex-1 ${recipe.saved ? 'bg-slate-200 text-slate-700' : 'bg-amber-500 text-white'} py-2.5 rounded-xl font-bold text-xs transition active:scale-95 shadow-sm">
              <i class="fa-solid fa-bookmark mr-1"></i>${recipe.saved ? '저장됨' : '레시피 저장하기'}
            </button>
            <button onclick="goHome()" class="bg-slate-800 text-white px-4 py-2.5 rounded-xl font-bold text-xs transition active:scale-95">
              목록으로
            </button>
          </div>
        </div>
      `;
      renderView(html);
    }

    // Toggle Save Status
    function toggleSave(id) {
      const item = recipeDatabase.find(r => r.id === id);
      if (item) {
        item.saved = !item.saved;
        alert(item.saved ? '저장목록에 추가했어! ❤️' : '저장목록에서 해제했어!');
        showDetailView(id, false);
      }
    }

    // --- TAB: Saved List View ---
    function showSavedView(push = true) {
      if (push) historyStack.push('saved');
      const savedItems = recipeDatabase.filter(r => r.saved);

      const html = `
        <div class="space-y-3">
          <h2 class="font-bold text-slate-800 text-base flex items-center">
            <i class="fa-solid fa-bookmark text-amber-500 mr-2"></i>내가 저장한 레시피
          </h2>
          ${savedItems.length === 0 ? `
            <div class="text-center py-12 text-slate-400 space-y-2">
              <i class="fa-regular fa-bookmark text-3xl"></i>
              <p class="text-xs">아직 저장한 레시피가 없어!</p>
              <p class="text-[11px] text-slate-400">마음에 드는 레시피를 저장해보자.</p>
            </div>
          ` : `
            <div class="space-y-2">
              ${savedItems.map(item => `
                <div onclick="showDetailView(${item.id})" class="bg-white p-3 rounded-xl border border-slate-100 flex items-center justify-between cursor-pointer hover:border-amber-300 transition active:scale-98 shadow-xs">
                  <div class="flex items-center space-x-3">
                    <span class="text-2xl">${item.emoji}</span>
                    <div>
                      <h4 class="font-bold text-xs text-slate-800">${item.title}</h4>
                      <p class="text-[10px] text-slate-400">${item.category} • ${item.time}</p>
                    </div>
                  </div>
                  <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
      renderView(html);
    }

    // --- TAB: My Recipes View (유튜브 형태) ---
    function showMyView(push = true) {
      if (push) historyStack.push('my');
      const myItems = recipeDatabase.filter(r => r.my);

      const html = `
        <div class="space-y-3">
          <h2 class="font-bold text-slate-800 text-base flex items-center">
            <i class="fa-solid fa-circle-user text-amber-500 mr-2"></i>내가 만든 레시피 채널
          </h2>
          <div class="bg-amber-100 p-3 rounded-xl text-xs text-amber-800 flex items-center justify-between">
            <span>📹 유튜브처럼 자유롭게 공유하는 공간!</span>
            <button onclick="switchTab('add')" class="bg-amber-500 text-white px-2 py-1 rounded text-[10px] font-bold">올리기</button>
          </div>

          ${myItems.length === 0 ? `
            <div class="text-center py-12 text-slate-400 space-y-2">
              <i class="fa-solid fa-utensils text-3xl"></i>
              <p class="text-xs">직접 등록한 레시피가 없어!</p>
              <button onclick="switchTab('add')" class="bg-amber-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold">첫 레시피 만들기</button>
            </div>
          ` : `
            <div class="space-y-2">
              ${myItems.map(item => `
                <div onclick="showDetailView(${item.id})" class="bg-white p-3 rounded-xl border border-slate-100 flex items-center justify-between cursor-pointer hover:border-amber-300 transition active:scale-98 shadow-xs">
                  <div class="flex items-center space-x-3">
                    <span class="text-2xl">${item.emoji}</span>
                    <div>
                      <h4 class="font-bold text-xs text-slate-800">${item.title}</h4>
                      <span class="text-[9px] bg-green-100 text-green-700 font-bold px-1 rounded">내가 업로드함</span>
                    </div>
                  </div>
                  <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
      renderView(html);
    }

    // --- TAB: Add Recipe View ---
    function showAddView(push = true) {
      if (push) historyStack.push('add');

      const html = `
        <div class="space-y-3">
          <h2 class="font-bold text-slate-800 text-base flex items-center">
            <i class="fa-solid fa-plus-circle text-amber-500 mr-2"></i>새 레시피 올리기
          </h2>
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3 text-xs">
            <div>
              <label class="font-bold text-slate-700 block mb-1">요리 이름</label>
              <input id="add-title" type="text" placeholder="예: 초간단 치즈 라면" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">이모지 아이콘</label>
              <input id="add-emoji" type="text" placeholder="예: 🍜" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">한 줄 설명</label>
              <input id="add-desc" type="text" placeholder="맛있는 이유를 적어줘!" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">필요한 재료 (쉼표로 구분)</label>
              <input id="add-ing" type="text" placeholder="예: 라면, 치즈, 계란" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-amber-500">
            </div>
            <button onclick="saveNewRecipe()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition active:scale-95 shadow-sm text-xs mt-2">
              업로드하기 🚀
            </button>
          </div>
        </div>
      `;
      renderView(html);
    }

    // Save New Recipe Logic
    function saveNewRecipe() {
      const title = document.getElementById('add-title').value.trim();
      const emoji = document.getElementById('add-emoji').value.trim() || '🍳';
      const desc = document.getElementById('add-desc').value.trim();
      const ingRaw = document.getElementById('add-ing').value.trim();

      if (!title || !desc) {
        alert('요리 이름과 설명을 적어줘!');
        return;
      }

      const ingredients = ingRaw ? ingRaw.split(',').map(s => s.trim()) : ['기본 재료'];

      const newRecipe = {
        id: Date.now(),
        title: title,
        category: '나만의 요리',
        emoji: emoji,
        time: '10분',
        desc: desc,
        ingredients: ingredients,
        steps: ['맛있게 재료를 준비합니다.', "레시피대로 조리합니다.", "맛있게 완성하여 즐깁니다!"],
        saved: false,
        my: true
      };

      recipeDatabase.unshift(newRecipe);
      alert('새로운 레시피가 성공적으로 올려졌어! 🎉');
      showMyView(false);
    }

    // Initial Load
    window.onload = function() {
      showMainView(false);
    };
  </script>
