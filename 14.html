        }
        
        .neon-text-cyan {
            text-shadow: 0 0 5px #06b6d4, 0 0 10px #06b6d4, 0 0 20px #06b6d4, 0 0 40px #0891b2;
        }

            box-shadow: 0 0 10px #a855f7, inset 0 0 10px #a855f7;

        }

        .neon-button-pink {
            background: linear-gradient(135deg, #f43f5e, #881337);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
        }
        .neon-button-pink:hover {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.9);
        }

        .neon-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(192, 132, 252, 0.3);
        }

        /* Phone Frame Customization */
        .phone-container {
            width: 100%;
            max-width: 390px;
            height: 800px;
            max-height: 92vh;
            border-radius: 40px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), 0 0 60px rgba(6, 182, 212, 0.2);

        /* Loading Spinner Animation */
        @keyframes spin-neon {
            0% { transform: rotate(0deg); box-shadow: 0 0 15px #06b6d4; }
            50% { transform: rotate(180deg); box-shadow: 0 0 25px #f43f5e; }
            100% { transform: rotate(360deg); box-shadow: 0 0 15px #06b6d4; }
        }

        .neon-spinner {
            animation: spin-neon 1.5s linear infinite;
        }
    </style>
</head>

        // --- Init Function ---
        window.onload = function() {
            updateDateTime();
            setInterval(updateDateTime, 10000); // 10 sec update
            fetchLocationAndWeather();
        };

        // --- Live Date & Time Updates ---
        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? '오후' : '오전';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0시를 12시로 표기

            document.getElementById('env-date').textContent = `${year}.${month}.${date}`;
            document.getElementById('env-time').textContent = `${ampm} ${hours}:${minutes}`;
            document.getElementById('top-time').textContent = `${hours}:${minutes}`;
        }

        // --- Live Location & Weather Fetch (Geolocation + Open-Meteo API) ---
        function fetchLocationAndWeather() {
            const weatherEl = document.getElementById('env-weather');

            if (!navigator.geolocation) {
                currentWeatherData = { location: '위치 정보 미지원', temp: '', emoji: '🌤️' };
                weatherEl.textContent = "날씨 정보 없음";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    try {
                        // Open-Meteo Weather API
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const data = await res.json();
                        
                        if (data && data.current_weather) {
                            const temp = Math.round(data.current_weather.temperature);
                            const weatherCode = data.current_weather.weathercode;
                            const emoji = getWeatherEmoji(weatherCode);

                            currentWeatherData = {
                                location: '내 주변',
                                temp: `${temp}°C`,
                                emoji: emoji
                            };
                            weatherEl.textContent = `${currentWeatherData.location} ${emoji} ${currentWeatherData.temp}`;
                        } else {
                            weatherEl.textContent = "날씨 정보 없음";
                        }
                    } catch (err) {
                        weatherEl.textContent = "날씨 정보 없음";
                    }
                },
                (error) => {
                    // Position Permission Denied or Failed
                    weatherEl.textContent = "날씨 정보 없음";
                },
                { timeout: 7000 }
            );
        }

        // Weather Code to Emoji Helper
        function getWeatherEmoji(code) {
            if (code === 0) return '☀️'; // Clear
            if (code >= 1 && code <= 3) return '☁️'; // Clouds
            if (code >= 45 && code <= 48) return '🌫️'; // Fog
            if (code >= 51 && code <= 67) return '🌧️'; // Rain
            if (code >= 71 && code <= 77) return '❄️'; // Snow
            if (code >= 80 && code <= 82) return '🌦️'; // Showers
            if (code >= 95) return '⚡'; // Thunderstorm
            return '🌤️';
        }

        function goToPage(pageId) {
            previousPage = currentPage;
            currentPage = pageId;

            document.getElementById('page-start').classList.add('hidden');
            document.getElementById('page-analysis').classList.add('hidden');
            document.getElementById('page-result').classList.add('hidden');

            document.getElementById(`page-${pageId}`).classList.remove('hidden');
        }

        function handleBack() {
            if (currentPage === 'result' || currentPage === 'analysis') {
                goToPage('start');
            }
        }

        // --- Select Mood & Trigger Analysis Step ---
        function selectMood(mood) {
            selectedMood = mood;
            goToPage('analysis');

            // Animate Progress Bar
            const pBar = document.getElementById('progress-bar');
            pBar.style.width = '0%';
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 20;
                pBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        renderResults();
                        goToPage('result');
                    }, 400);
                }
            }, 300);
        }

        // --- Render 2-3 Random Recommendations ---
        function renderResults() {
            const listContainer = document.getElementById('song-list');
            const reasonBox = document.getElementById('result-reason-box');
            listContainer.innerHTML = '';

            const now = new Date();
            const hour = now.getHours();
            let timeText = hour >= 6 && hour < 12 ? '밝은 아침' : (hour >= 12 && hour < 18 ? '나른한 오후' : '감성 가득한 밤');
            
            const weatherDesc = currentWeatherData.temp !== '' ? `${currentWeatherData.emoji} ${currentWeatherData.temp}` : '오늘 날씨';

            // Customized Recommendation Reason Text
            reasonBox.innerHTML = `
                <div class="font-bold text-pink-300 mb-0.5"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>맞춤 큐레이션 완료!</div>
                <div>${timeText} (${weatherDesc}), ✨<b>[${selectedMood}]</b> 기분인 너를 위해 딱 맞는 노래 3곡을 콕콕 집어왔어!</div>
            `;

            // Random Pick 3 Songs from DB
            const pool = songDatabase[selectedMood] || songDatabase['신남'];
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            const selectedSongs = shuffled.slice(0, 3);

            // Generate Song Cards with YouTube Links
            selectedSongs.forEach((song, idx) => {
                const searchKeyword = encodeURIComponent(`${song.artist} ${song.title}`);
                const youtubeUrl = `https://www.youtube.com/results?search_query=${searchKeyword}`;

                const card = document.createElement('div');
                card.className = "neon-card rounded-2xl p-3 flex flex-col justify-between hover:border-pink-500/60 transition group";
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center font-orbit font-bold text-white shadow-md">
                                0${idx + 1}
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-white group-hover:text-pink-300 transition line-clamp-1">${song.title}</h3>
                                <p class="text-xs text-slate-400">${song.artist} • <span class="text-cyan-400 font-semibold">${song.genre}</span></p>
                            </div>
                        </div>
                        <a href="${youtubeUrl}" target="_blank" rel="noopener noreferrer" 
                           class="px-2.5 py-1.5 bg-red-600/90 hover:bg-red-600 text-white text-xs font-bold rounded-lg flex items-center gap-1 shadow-lg shadow-red-900/40 shrink-0 transition active:scale-95">
                            <i class="fa-brands fa-youtube text-sm"></i> 들어보기
                        </a>
                    </div>
                    <div class="mt-2 text-[11px] text-slate-300 bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                        💬 ${song.desc}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
