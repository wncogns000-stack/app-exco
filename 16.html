<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의게임 - Retro Game Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Retro Style -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DungGeunMo&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DungGeunMo', monospace;
            background-color: #0d0614;
            color: #fff;
            user-select: none;
        }
        .retro-title {
            font-family: 'Press Start 2P', cursive;
            text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff;
        }
        .neon-box {
            border: 3px solid #b026ff;
            box-shadow: 0 0 15px #b026ff, inset 0 0 15px #b026ff;
        }
        .neon-btn {
            background: linear-gradient(135deg, #7b1fa2, #4a148c);
            border: 2px solid #e040fb;
            box-shadow: 0 0 10px #e040fb;
            transition: all 0.2s ease-in-out;
        }
        .neon-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #e040fb, 0 0 30px #e040fb;
        }
        .neon-btn:active {
            transform: scale(0.97);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a0933;
        }
        ::-webkit-scrollbar-thumb {
            background: #b026ff;
            border-radius: 3px;
        }
        /* Loading Animation Bar */
        @keyframes pixelLoading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        .loading-bar-fill {
            animation: pixelLoading 2.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- 스마트폰 외형 테두리 -->

        <!-- 상단 스피커 & 카메라 노치 -->

            <div class="text-[10px] text-purple-300 flex items-center gap-1" id="top-time">
                <span>00:00</span>
            </div>
            <div class="w-16 h-3 bg-purple-950 rounded-full border border-purple-800/50 flex items-center justify-center">
                <div class="w-2 h-2 bg-purple-600 rounded-full"></div>
            </div>
            <div class="text-[10px] text-purple-300 flex items-center gap-1">

        <!-- 메인 콘텐츠 영역 (스크롤 가능) -->

            <!-- PAGE 1: 시작 화면 (Start Screen) -->
            <div id="page-1" class="flex flex-col items-center justify-between h-full py-4 text-center">
                <div class="mt-4">
                    <p class="text-xs text-cyan-400 tracking-widest mb-1 animate-pulse">★ RETRO ARCADE CENTER ★</p>

                </div>

                <!-- 실시간 정보 위젯 -->
                <div class="w-full neon-box bg-purple-950/40 p-3 rounded-xl backdrop-blur-sm text-xs space-y-1 my-2">
                    <div class="flex justify-between items-center border-b border-purple-800/60 pb-1">
                        <span class="text-gray-400">📅 오늘 날짜</span>
                        <span class="text-cyan-300 font-mono" id="env-date">----.--.--</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-purple-800/60 pb-1">

                    </div>

                    </div>
                </div>

                <!-- 중앙 비주얼 일러스트 (우주선/테트리스 레트로 느낌) -->
                <div class="my-3 text-4xl animate-bounce">
                    👾 🚀 🕹️
                </div>

                <!-- 메인 버튼 2개 -->
                <div class="w-full space-y-3">
                    <button onclick="startAnalysis()" class="w-full py-3 text-sm font-bold text-white neon-btn rounded-xl flex items-center justify-center gap-2">
                        <span>🎲 오늘 뭐하지? 추천받기</span>
                    </button>
                    <button onclick="openVaultModal()" class="w-full py-2.5 text-xs font-bold text-purple-200 bg-purple-900/60 border border-purple-500 rounded-xl hover:bg-purple-800/80 transition flex items-center justify-center gap-2">
                        <span>🔑 계정 보관함 (ID/PW)</span>
                    </button>
                </div>
            </div>

            <!-- PAGE 2: 분석 중 화면 (Loading Screen) -->
            <div id="page-2" class="hidden flex-col items-center justify-center h-full text-center py-8">
                <div class="text-5xl mb-6 animate-spin text-purple-400">
                    ⚙️
                </div>
                <h2 class="text-lg font-bold text-purple-200 mb-2">분석 칩 가동 중...</h2>

                <!-- 로딩 바 -->
                <div class="w-full h-4 bg-purple-950 rounded-full border border-purple-600 p-0.5 overflow-hidden">

            <!-- PAGE 3: 결과 추천 화면 (Result Screen) -->
            <div id="page-3" class="hidden flex-col h-full py-2">

                    <button onclick="startAnalysis()" class="text-[10px] text-cyan-400 hover:underline">🔄 다시 뽑기</button>

            <div>
                <div class="flex justify-between items-center border-b border-purple-700 pb-2 mb-3">

                    <input type="text" id="vault-id" placeholder="아이디 (ID)" class="w-full bg-black/80 border border-purple-700 rounded px-2 py-1 text-xs text-purple-200 focus:outline-none focus:border-cyan-400">
                    <input type="password" id="vault-pw" placeholder="비밀번호 (PW)" class="w-full bg-black/80 border border-purple-700 rounded px-2 py-1 text-xs text-purple-200 focus:outline-none focus:border-cyan-400">
                    <button onclick="saveAccount()" class="w-full py-1.5 bg-purple-700 text-xs text-white rounded hover:bg-purple-600 transition font-bold">
                        ➕ 저장하기
                    </button>
                </div>

                <!-- 계정 목록 -->
                <div class="max-h-[300px] overflow-y-auto space-y-2" id="vault-list">
                    <!-- Saved Accounts will be injected here -->
                </div>
            </div>
            <button onclick="closeVaultModal()" class="w-full py-2 bg-gray-800 text-xs text-gray-300 rounded hover:bg-gray-700">
                닫기
            </button>
        </div>

        <!-- 하단 레트로 모바일 스마트폰 네비게이션 바 -->
        <div class="w-full bg-[#12072b] py-2 px-8 border-t border-purple-900/80 flex justify-between items-center z-20">
            <!-- ☰ 메뉴 (비밀 수첩) -->
            <button onclick="openVaultModal()" class="text-purple-400 hover:text-purple-200 text-sm active:scale-90 transition" title="메뉴">
                ☰
            </button>
            <!-- ⌂ 홈 (시작화면) -->
            <button onclick="goToPage(1)" class="text-purple-400 hover:text-purple-200 text-base active:scale-90 transition" title="홈">
                ⌂
            </button>

            <button onclick="goBack()" class="text-purple-400 hover:text-purple-200 text-sm active:scale-90 transition" title="뒤로가기">
                ◁

    </div>

    <!-- JavaScript Logic -->
    <script>
        // 전역 상태 변수
        let currentPage = 1;
        let previousPage = 1;
        let weatherData = { temp: '--', condition: '맑음', emoji: '☀️' };
        let userAccounts = [];

        // 60가지 게임 종합 데이터 풀 (건전하고 다채로운 게임들로 구성)
        const gameDatabase = [
            // 맑은 날 / 낮에 어울리는 활동적인 게임들

            { name: "알비온 온라인", category: "MMORPG", vibe: "clear_day", reason: "탁 트인 넓은 광활한 대륙을 탐험해 보세요!" },
            { name: "클래시 로얄", category: "전략", vibe: "clear_day", reason: "빠른 판단력과 순발력으로 짜릿한 승리를 거두세요!" },
            { name: "탕탕특공대", category: "캐주얼", vibe: "clear_day", reason: "화려한 시각 효과와 함께 스트레스를 한 번에 날리기!" },

            // 비/구름/밤 시간대에 어울리는 감성 및 집중형 게임들
            { name: "테트리스 (Tetris)", category: "퍼즐", vibe: "rain_night", reason: "차분하고 조용한 분위기 속에서 즐기는 불후의 클래식 픽셀 퍼즐!" },
            { name: "고양이와 스프", category: "방치형/힐링", vibe: "rain_night", reason: "빗소리를 들으며 조용히 고양이들과 따뜻한 힐링 타이머!" },
            { name: "모뉴먼트 밸리", category: "퍼즐/퍼즐", vibe: "rain_night", reason: "어두운 밤 잔잔한 음악과 함께 아름다운 착시 공간을 모험하세요." },
            { name: "쿠키런: 킹덤", category: "수집형 RPG", vibe: "rain_night", reason: "아기자기한 쿠키들의 왕국을 밤에 하나씩 가꾸는 재미!" },
            { name: "원신", category: "어드벤처", vibe: "rain_night", reason: "차분히 앉아 판타지 세계관의 깊은 스토리를 몰입해 감상하기!" },
            { name: "스노우 브레이크", category: "슈팅", vibe: "rain_night", reason: "밤 시간대에 어두운 조명 아래 즐기는 감각적 슈팅 액션!" },

            { name: "꿈의 집 (Homescapes)", category: "퍼즐", vibe: "rain_night", reason: "편안하게 침대에 누워 즐기는 3매치 퍼즐과 인테리어!" },
            { name: "동물의 숲 포켓 캠프", category: "시뮬레이션", vibe: "rain_night", reason: "밤하늘 별 아래에서 귀여운 동물 친구들과 캠핑장 가꾸기!" },
            { name: "랜덤 다이스", category: "타워 디펜스", vibe: "rain_night", reason: "고요함 속에서 몰입도 높은 주사위 조합 전략 맞대결!" },

            // 레트로 감성 & 일반 레전드 게임들 (어느 조건에나 추가 추천 가능)
            { name: "갤러그 (Galaga)", category: "레트로 슈팅", vibe: "retro", reason: "옛날 고전 우주선 게임의 참맛! 적들을 소탕하세요!" },
            { name: "스트리트 파이터 II", category: "레트로 대전", vibe: "retro", reason: "오락실 철권이 생각나는 전설의 커맨드 대전 액션!" },
            { name: "팩맨 (PAC-MAN)", category: "레트로 아케이드", vibe: "retro", reason: "미로 속을 누비는 영원한 추억의 레트로 아이콘!" },
            { name: "버블보블 (보글보글)", category: "레트로 아케이드", vibe: "retro", reason: "방울을 쏘아 적을 가두는 아기자기한 레트로 챔피언!" },
            { name: "스페이스 인베이더", category: "레트로 슈팅", vibe: "retro", reason: "우주선 게임의 원조! 내려오는 외계인을 격추하자!" },
            { name: "포켓몬 GO", category: "AR 위치 기반", vibe: "any", reason: "밖을 서성이며 탐험하기 좋은 특별한 수집 모험!" },
            { name: "피망 뉴맞고", category: "보드", vibe: "any", reason: "손맛이 살아있는 전통 보드게임 카테고리!" },
            { name: "스컬걸즈", category: "격투", vibe: "any", reason: "화려한 애니메이션이 돋보이는 모바일 격투 액션!" },
            { name: "슬레이 더 스파이어", category: "덱빌딩", vibe: "any", reason: "두뇌를 풀가동하는 주옥같은 카드 전략 게임!" },
            { name: "하스스톤", category: "카드", vibe: "any", reason: "월드 오브 워크래프트 영웅들의 카드 대전!" },
            { name: "어몽 어스", category: "추리", vibe: "any", reason: "친구들과 우주선에서 숨은 임포스터를 찾아내는 재미!" },
            { name: "로블록스 (Roblox)", category: "메타버스", vibe: "any", reason: "수천 가지 개성 넘치는 플레이그라운드를 선택해서 플레이!" }
        ];

        // 페이지 이동 제어 함수
        function goToPage(pageNumber) {
            previousPage = currentPage;
            currentPage = pageNumber;

            document.getElementById('page-1').classList.add('hidden');
            document.getElementById('page-2').classList.add('hidden');
            document.getElementById('page-3').classList.add('hidden');

            document.getElementById(`page-${pageNumber}`).classList.remove('hidden');
            document.getElementById(`page-${pageNumber}`).classList.add('flex');
        }

        // 뒤로가기 버튼 동작
        function goBack() {
            if (currentPage === 3 || currentPage === 2) {
                goToPage(1);
            } else {
                closeVaultModal();
            }
        }

        // 시간 및 날짜 갱신 함수
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('env-date').innerText = `${year}.${month}.${date}`;
            document.getElementById('env-time').innerText = `${hours}:${minutes}:${seconds}`;
            document.getElementById('top-time').innerText = `${hours}:${minutes}`;
        }

        // 실시간 날씨 연동 (Open-Meteo & Geolocation API 사용)
        function fetchWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        // Open-Meteo API 호출
                        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                            .then(response => response.json())
                            .then(data => {
                                const weather = data.current_weather;
                                const temp = Math.round(weather.temperature);
                                const code = weather.weathercode;

                                let emoji = '☀️';
                                let cond = '맑음';

                                if (code >= 1 && code <= 3) { emoji = '☁️'; cond = '구름조금'; }
                                else if (code >= 45 && code <= 48) { emoji = '🌫️'; cond = '안개'; }
                                else if (code >= 51 && code <= 67) { emoji = '🌧️'; cond = '비'; }
                                else if (code >= 71) { emoji = '❄️'; cond = '눈'; }

                                weatherData = { temp, condition: cond, emoji };
                                document.getElementById('env-weather').innerText = `${emoji} ${cond} ${temp}°C`;
                            })
                            .catch(() => {
                                document.getElementById('env-weather').innerText = "날씨 정보 없음";
                            });
                    },
                    (error) => {
                        // 위치 서비스 차단 또는 오류 시 서울 기본값이 아닌 날씨 정보 없음으로 표기
                        document.getElementById('env-weather').innerText = "날씨 정보 없음";
                    }
                );
            } else {
                document.getElementById('env-weather').innerText = "날씨 정보 없음";
            }
        }

        // 2단계 분석 로딩 후 3단계 결과 출력 함수
        function startAnalysis() {
            goToPage(2);
            
            const currentHour = new Date().getHours();
            let timeContext = (currentHour >= 6 && currentHour < 18) ? "day" : "night";
            
            // 로딩 문구 업데이트
            document.getElementById('loading-desc').innerText = `현재 [${weatherData.emoji} ${weatherData.condition}] 날씨와 [${timeContext === 'day' ? '낮' : '밤'}] 시간을 계산하고 있습니다...`;

            setTimeout(() => {
                generateRecommendations(timeContext);
                goToPage(3);
            }, 2500); // 2.5초 레트로 분석 연출
        }

        // 랜덤 추천 및 결과 생성 로직
        function generateRecommendations(timeContext) {
            const contextTextEl = document.getElementById('result-context-text');
            const listEl = document.getElementById('recommendation-list');
            listEl.innerHTML = '';

            let targetVibe = "clear_day";
            if (weatherData.condition.includes("비") || weatherData.condition.includes("눈") || timeContext === "night") {
                targetVibe = "rain_night";
                contextTextEl.innerText = `${weatherData.emoji} 차분한 분위기 & 밤 시간에 집중하기 좋은 추천!`;
            } else {
                contextTextEl.innerText = `${weatherData.emoji} 활력 넘치는 날씨 & 낮 시간에 즐기는 추천!`;
            }

            // 조건에 부합하는 후보군 선별 + 레트로/공통 게임 포함
            let candidates = gameDatabase.filter(g => g.vibe === targetVibe || g.vibe === 'retro' || g.vibe === 'any');

            // Math.random()을 사용하여 3개 무작위 중복 없이 추출
            let shuffled = candidates.sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, 3);

            // 추천 결과 카드 렌더링 (구글 플레이 스토어 검색 링크 연동)
            selected.forEach((game, index) => {
                const searchUrl = `https://play.google.com/store/search?q=${encodeURIComponent(game.name)}&c=apps`;

                const card = document.createElement('div');
                card.className = "neon-box bg-purple-950/70 p-3 rounded-xl flex flex-col justify-between space-y-2 relative overflow-hidden";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[9px] bg-purple-900 border border-purple-500 text-purple-300 px-1.5 py-0.5 rounded">
                                LIST 0${index + 1} • ${game.category}
                            </span>
                            <h4 class="text-sm font-bold text-cyan-300 mt-1">${game.name}</h4>
                        </div>
                        <span class="text-xl">🕹️</span>
                    </div>
                    <p class="text-[11px] text-gray-300 leading-snug">
                        💬 <span class="text-purple-200">${game.reason}</span>
                    </p>
                    <a href="${searchUrl}" target="_blank" rel="noopener noreferrer" 
                       class="w-full py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-[11px] font-bold rounded text-center block transition shadow-[0_0_8px_#00ffff]">
                       📲 구글 플레이스토어에서 플레이하기
                    </a>
                `;
                listEl.appendChild(card);
            });
        }

        // 비밀 수첩 모달 제어
        function openVaultModal() {
            document.getElementById('vault-modal').classList.remove('hidden');
            renderAccountList();
        }

        function closeVaultModal() {
            document.getElementById('vault-modal').classList.add('hidden');
        }

        // 계정 저장 기능 (클라이언트 메모리 저장)
        function saveAccount() {
            const gameInput = document.getElementById('vault-game');
            const idInput = document.getElementById('vault-id');
            const pwInput = document.getElementById('vault-pw');

            if (!gameInput.value || !idInput.value || !pwInput.value) {
                alert('모든 입력 항목을 채워주세요!');
                return;
            }

            userAccounts.push({
                game: gameInput.value,
                id: idInput.value,
                pw: pwInput.value
            });

            gameInput.value = '';
            idInput.value = '';
            pwInput.value = '';

            renderAccountList();
        }

        // 저장된 계정 삭제 기능
        function deleteAccount(index) {
            userAccounts.splice(index, 1);
            renderAccountList();
        }

        // 저장된 계정 목록 렌더링
        function renderAccountList() {
            const listEl = document.getElementById('vault-list');
            listEl.innerHTML = '';

            if (userAccounts.length === 0) {
                listEl.innerHTML = `<p class="text-center text-xs text-gray-500 py-4">저장된 계정이 없습니다.</p>`;
                return;
            }

            userAccounts.forEach((acc, index) => {
                const item = document.createElement('div');
                item.className = "bg-purple-900/40 border border-purple-700/60 p-2 rounded flex justify-between items-center text-xs";
                item.innerHTML = `
                    <div>
                        <span class="font-bold text-cyan-300 block">${acc.game}</span>
                        <span class="text-gray-300 text-[10px]">ID: ${acc.id} | PW: ${acc.pw}</span>
                    </div>
                    <button onclick="deleteAccount(${index})" class="text-red-400 hover:text-red-300 text-xs px-1">
                        🗑️
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        // 초기화 실행
        setInterval(updateClock, 1000);
        updateClock();
        fetchWeather();
    </script>
